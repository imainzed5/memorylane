name: Release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-installer-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Bundle Tesseract OCR installer
        shell: pwsh
        env:
          TESSERACT_URL: https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe
          TESSERACT_SHA256: c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9
        run: |
          $target = "src-tauri/resources/tesseract/tesseract-installer.exe"
          Invoke-WebRequest -Uri $env:TESSERACT_URL -OutFile $target
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:TESSERACT_SHA256) { throw "Tesseract installer hash mismatch: $hash" }

      - name: Build frontend
        run: npm.cmd run build

      - name: Build Windows installers
        run: npm.cmd run tauri -- build

      - name: Stage release assets
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $env:LOCALAPPDATA "memorylane\cargo-target\release\bundle"
          $stagingDir = Join-Path $env:GITHUB_WORKSPACE "release-assets"

          if (-not (Test-Path $bundleRoot)) {
            throw "Bundle output not found at $bundleRoot"
          }

          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          Get-ChildItem -Path $bundleRoot -Recurse -File |
            Where-Object { $_.Extension -eq '.exe' } |
            Copy-Item -Destination $stagingDir -Force

          Get-ChildItem -Path $stagingDir

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: MemoryLane ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            release-assets/*.exe
          fail_on_unmatched_files: true
